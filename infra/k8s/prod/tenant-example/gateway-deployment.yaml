apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tenant-example
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: omnichannel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: omnichannel
    spec:
      automountServiceAccountToken: false
      serviceAccountName: gateway
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: gateway
          image: ghcr.io/nerrazzuri/omni-gateway:staging
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: "staging"
            - name: AI_CORE_URL
              value: http://ai-core:8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: tenant-example
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: omnichannel
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3001
      targetPort: 3001


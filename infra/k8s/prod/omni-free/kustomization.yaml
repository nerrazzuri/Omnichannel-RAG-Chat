apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: omni-free
resources:
  - gateway-deployment.yaml
  - ai-core-deployment.yaml
  - frontend-deployment.yaml
patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          rollout.canary/weight: "5%"
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: ai-core
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1



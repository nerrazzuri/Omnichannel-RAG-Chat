apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: omni-staging
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/gateway:latest
          ports:
            - containerPort: 3001
          env:
            - name: AI_CORE_URL
              value: http://ai-core:8000
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: omni-staging
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3001
      targetPort: 3001

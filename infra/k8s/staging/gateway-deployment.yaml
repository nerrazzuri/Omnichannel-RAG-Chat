apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "gateway"
        vault.hashicorp.com/agent-inject-secret-gateway.env: "kv/gateway"
        vault.hashicorp.com/agent-inject-template-gateway.env: |
          {{- with secret "kv/gateway" -}}
          export JWT_SECRET="{{ .Data.data.JWT_SECRET }}"
          export AI_CORE_URL="{{ .Data.data.AI_CORE_URL }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-sentry.env: "kv/gateway/sentry"
        vault.hashicorp.com/agent-inject-template-sentry.env: |
          {{- with secret "kv/gateway/sentry" -}}
          export SENTRY_DSN="{{ .Data.data.DSN }}"
          {{- end -}}
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: gateway
          image: nerrazzuri/omnichannel-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: "staging"
          envFrom:
            - secretRef:
                name: gateway-env
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: vault-secrets
          emptyDir: {}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: omni-staging
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: gateway
          image: ghcr.io/example/gateway:latest
          ports:
            - containerPort: 3001
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: AI_CORE_URL
              value: http://ai-core:8000
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: omni-staging
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3001
      targetPort: 3001

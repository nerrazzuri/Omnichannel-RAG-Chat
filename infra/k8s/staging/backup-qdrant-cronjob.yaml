apiVersion: batch/v1
kind: CronJob
metadata:
  name: qdrant-backup
spec:
  schedule: "30 */6 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: qdrant-backup
              image: curlimages/curl:8.7.1
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -e
                  TS=$(date +%s)
                  # Snapshot all collections (placeholder endpoint; adjust to your Qdrant API)
                  curl -s -X POST http://qdrant:6333/collections/_all/snapshots || true
                  SIZE=0
                  curl -s -X POST http://ai-core:8000/v1/admin/backup/mark \
                    -H 'Content-Type: application/json' \
                    -d "{\"system\":\"qdrant\",\"status\":\"success\",\"duration_ms\":0,\"size_bytes\":$SIZE,\"ts_unix\":$TS}" || true


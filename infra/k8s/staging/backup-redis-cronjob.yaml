apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
spec:
  schedule: "15 */6 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          restartPolicy: OnFailure
          containers:
            - name: redis-backup
              image: amazon/aws-cli:2.15.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  /bin/bash /scripts/redis_backup.sh
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts


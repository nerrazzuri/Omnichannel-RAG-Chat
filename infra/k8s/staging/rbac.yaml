apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-core
  namespace: omni-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: omni-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: omni-staging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: omni-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-minimal
  namespace: omni-staging
rules:
  - apiGroups: [""]
    resources: ["configmaps", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-core-minimal
  namespace: omni-staging
subjects:
  - kind: ServiceAccount
    name: ai-core
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-minimal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-minimal
  namespace: omni-staging
subjects:
  - kind: ServiceAccount
    name: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-minimal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-minimal
  namespace: omni-staging
subjects:
  - kind: ServiceAccount
    name: frontend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-minimal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-minimal
  namespace: omni-staging
subjects:
  - kind: ServiceAccount
    name: backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workload-minimal


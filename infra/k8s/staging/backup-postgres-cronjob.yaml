apiVersion: batch/v1
kind: CronJob
metadata:
  name: pg-backup
spec:
  schedule: "0 */6 * * *" # every 6 hours
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ai-core
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: amazon/aws-cli:2.15.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGBACKUP_S3_URL
                  valueFrom:
                    secretKeyRef:
                      name: backup-secrets
                      key: PGBACKUP_S3_URL
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: backup-secrets
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: backup-secrets
                      key: PGPASSWORD
              command: ["/bin/bash", "-lc"]
              args:
                - |
                  set -euo pipefail
                  /bin/bash /scripts/pg_backup.sh
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts


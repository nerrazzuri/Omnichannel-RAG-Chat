version: "3.9"

networks:
  backend_net:
  frontend_net:
  data_net:

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:

services:

  # =========================
  # Reverse Proxy (ONLY public entry)
  # =========================
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
      - backend_net

  # =========================
  # DATABASES (internal only)
  # =========================
  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_dev
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_dev"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.5.0
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - data_net

  # =========================
  # AI Core (internal API)
  # =========================
  ai-core:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://chatbot_user:chatbot_password@postgresql:5432/chatbot_dev
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_EMBED_MODEL=text-embedding-3-large
      - RAG_CHAT_MODEL=gpt-4o-mini
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - backend_net
      - data_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/v1/health').getcode()==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================
  # Gateway (internal API)
  # =========================
  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    environment:
      - AI_CORE_URL=http://ai-core:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      ai-core:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 2s
      retries: 5
      start_period: 20s

  # =========================
  # Frontend (internal only)
  # =========================
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=/api
    networks:
      - frontend_net

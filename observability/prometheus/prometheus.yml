global:
  scrape_interval: 15s

rule_files:
  - rules/*.yaml

scrape_configs:
  - job_name: 'ai-core'
    static_configs:
      - targets: ['ai-core:8000']
    metrics_path: /metrics

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:3001']
    metrics_path: /api/metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics



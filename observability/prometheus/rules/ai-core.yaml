groups:
  - name: ai-core
    rules:
      - alert: AICoreHighLatencyWarning
        expr: histogram_quantile(0.95, sum(rate(ai_core_request_latency_seconds_bucket[10m])) by (le)) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "AI-Core p95 latency high"
      - alert: AICoreHighLatencyCritical
        expr: histogram_quantile(0.95, sum(rate(ai_core_request_latency_seconds_bucket[30m])) by (le)) > 1.5
        for: 30m
        labels: { severity: critical }
        annotations:
          summary: "AI-Core p95 latency sustained high"
      - alert: AICoreErrorBudget
        expr: (sum(rate(ai_core_requests_total{status=~"5.."}[15m])) / sum(rate(ai_core_requests_total[15m]))) > 0.01
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "AI-Core 5xx rate above 1%"


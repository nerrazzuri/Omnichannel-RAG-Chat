groups:
  - name: slo.prod
    rules:
      - alert: GatewayAvailabilityLow
        expr: (1 - (sum(rate(gateway_requests_total{status=~"5.."}[5m])) / sum(rate(gateway_requests_total[5m])))) < 0.995
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Gateway availability below SLO
      - alert: AICoreLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(ai_core_request_latency_seconds_bucket[5m])) by (le)) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: AI-Core p95 latency above SLO
      - alert: FreePlanCostGuard
        expr: increase(ai_core_requests_total{plan_type="free"}[30m]) > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Free plan traffic spike (cost guard)



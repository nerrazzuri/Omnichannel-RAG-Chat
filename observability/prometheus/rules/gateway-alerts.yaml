groups:
  - name: gateway
    rules:
      - alert: GatewayHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(gateway_request_latency_seconds_bucket[5m])) by (le)) > 0.8
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Gateway p95 latency high"
          runbook_url: "/docs/observability/runbooks/gateway.md"
      - alert: GatewayHighErrorRate
        expr: (sum(rate(gateway_requests_total{status=~"5.."}[5m])) / sum(rate(gateway_requests_total[5m]))) > 0.01
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Gateway 5xx rate >1%"
          runbook_url: "/docs/observability/runbooks/gateway.md"


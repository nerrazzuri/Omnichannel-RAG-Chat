groups:
  - name: backups
    rules:
      - alert: BackupsMissedWindow
        expr: (time() - backup_last_success_unixtime) > 24*3600
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "No successful backup in 24h"
          runbook_url: "/docs/observability/runbooks/backup_failure.md"


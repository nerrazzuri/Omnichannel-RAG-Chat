version: '3.8'

networks:
  frontend_net:
  backend_net:
  data_net:

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  vault_agent_out:

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - backend_net

  vault-seed:
    image: curlimages/curl:8.7.1
    container_name: vault-seed
    depends_on:
      vault:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "Seeding Vault KV v2 at secret/ai_core and secret/shared..."
        # Seed ai_core secrets (JWT + OpenAI)
        curl -sS -H "X-Vault-Token: root" -H "Content-Type: application/json" \
          --data "{\"data\":{\"JWT_SECRET\":\"${JWT_SECRET:-dev-secret-change-me-please-32-bytes-minimum}\",\"OPENAI_API_KEY\":\"${OPENAI_API_KEY:-}\"}}" \
          http://vault:8200/v1/secret/data/ai_core | cat
        # Also seed shared path used by Vault Agent template for gateway
        curl -sS -H "X-Vault-Token: root" -H "Content-Type: application/json" \
          --data "{\"data\":{\"JWT_SECRET\":\"${JWT_SECRET:-dev-secret-change-me-please-32-bytes-minimum}\"}}" \
          http://vault:8200/v1/secret/data/shared | cat
        echo "Done."
        sleep 1
    restart: "no"
    networks:
      - backend_net

  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: chatbot_dev
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD: chatbot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot_user -d chatbot_dev"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - data_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - data_net

  qdrant:
    image: qdrant/qdrant:v1.5.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - data_net

  ai-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ENV=dev
      - DATABASE_URL=postgresql://chatbot_user:chatbot_password@postgresql:5432/chatbot_dev
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_EMBED_MODEL=text-embedding-3-large
      - RAG_CHAT_MODEL=gpt-4o-mini
      # Enable Vault-backed secrets (JWT_SECRET, OPENAI_API_KEY)
      - VAULT_ENABLED=1
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - VAULT_MOUNT_PATH=secret/data/ai_core
      # Optional dev bypass (keep for local convenience)
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_ALLOW_ALL=1
      - AUTH_BYPASS_TENANT=00000000-0000-0000-0000-000000000001
    depends_on:
      vault:
        condition: service_started
      vault-seed:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend/src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/v1/ready').getcode()==200 else sys.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
      - data_net

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - AI_CORE_URL=http://ai-core:8000
      # Read JWT secret from env (matching Vault-seed value)
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - AUTH_ALLOW_ALL=1
      - AUTH_BYPASS_TENANT=00000000-0000-0000-0000-000000000001
    depends_on:
      ai-core:
        condition: service_healthy
    volumes:
      - ./gateway/src:/app/src:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
      - NEXT_PUBLIC_AI_CORE_URL=http://localhost:8000
      - AI_CORE_URL=http://ai-core:8000
      - NEXT_GATEWAY_ORIGIN=http://gateway:3001
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - frontend_net
      - backend_net



name: ci

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Lint (black, flake8)
        run: |
          black --check backend devops
          flake8 backend devops
      - name: Type check (mypy)
        run: mypy backend devops
      - name: Security scan (bandit)
        run: bandit -r backend -x backend/tests
      - name: Detect secrets
        run: |
          detect-secrets scan --all-files --json > devops/reports/detect-secrets.json || true
          python - <<'PY'
          import json,sys
          data=json.load(open('devops/reports/detect-secrets.json'))
          results=data.get('results') or {}
          if results:
              print('Potential secrets found by detect-secrets: devops/reports/detect-secrets.json')
              sys.exit(1)
          print('No potential secrets detected')
          PY
      - name: Tests (pytest)
        run: pytest -q backend/tests

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Gateway install, lint, test
        working-directory: gateway
        run: |
          npm ci
          npx eslint . --ext .ts,.tsx,.js
          npm test --silent
      - name: Frontend install, lint, test
        working-directory: frontend
        run: |
          npm ci
          npx eslint . --ext .ts,.tsx,.js
          npm test --silent


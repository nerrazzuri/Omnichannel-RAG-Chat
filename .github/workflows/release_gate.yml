name: Release Gate

on:
  workflow_dispatch: {}

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: pip-audit backend
        run: |
          pip-audit -r backend/requirements.txt || (echo "pip-audit found issues" && exit 1)
      - name: pip-audit backend ML
        run: |
          pip-audit -r backend/requirements-ml.txt || (echo "pip-audit (ml) found issues" && exit 1)

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit gateway
        run: |
          cd gateway
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Audit frontend
        run: |
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high

  env-validate:
    runs-on: ubuntu-latest
    env:
      REQUIRED: VAULT_ADDR,JWT_SECRET,DATABASE_URL,REDIS_URL,QDRANT_URL
    steps:
      - name: Validate required env vars provided
        run: |
          set -euo pipefail
          missing=0
          IFS=',' read -ra VARS <<< "$REQUIRED"
          for v in "${VARS[@]}"; do
            if [ -z "${!v:-}" ]; then echo "Missing env: $v"; missing=1; fi
          done
          test $missing -eq 0 || exit 2
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}

  health-checks:
    runs-on: ubuntu-latest
    needs: [dependency-audit, npm-audit, env-validate]
    env:
      API_BASE: ${{ secrets.READINESS_API_BASE }}
      ADMIN_BEARER: ${{ secrets.ADMIN_UPLOAD_BEARER }}
      TENANT_ID: ${{ secrets.COMPLIANCE_TENANT_ID }}
    steps:
      - name: Probe endpoints
        run: |
          set -euo pipefail
          curl -sS "${API_BASE}/v1/health" | jq . >/dev/null
          curl -sS "${API_BASE}/v1/ready" | jq . >/dev/null
          curl -sS "${API_BASE}/metrics" | head -n 5 >/dev/null
          curl -sS -X POST -H "Authorization: Bearer ${ADMIN_BEARER}" \
            -H 'Content-Type: application/json' \
            -d '{"query":"ping"}' "${API_BASE}/v1/query" | jq . >/dev/null



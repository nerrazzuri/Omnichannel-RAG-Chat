name: SAST & Secrets Scan

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          npm i -g npm@latest
          npm install --global @sxzz/secretlint secretlint
          curl -sSL https://github.com/zricethezav/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: 'p/ci'
          publishToken: ''
      - name: pip-audit
        run: pip-audit || true
      - name: npm audit
        run: |
          npm ci --ignore-scripts || true
          npm audit --audit-level=high || true
      - name: gitleaks
        run: gitleaks detect --no-git -v || true



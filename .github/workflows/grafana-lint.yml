name: Grafana Dashboard Lint

on:
  push:
    paths:
      - 'observability/grafana/dashboards/**/*.json'
      - 'observability/grafana/lint_dashboards.py'
  pull_request:
    paths:
      - 'observability/grafana/dashboards/**/*.json'
      - 'observability/grafana/lint_dashboards.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
      - name: Lint dashboards
        run: |
          python observability/grafana/lint_dashboards.py observability/grafana/dashboards



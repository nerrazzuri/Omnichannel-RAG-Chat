name: Terraform Parity Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/terraform/**'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Init staging
        working-directory: infra/terraform/staging
        run: terraform init -input=false
      - name: Plan staging
        working-directory: infra/terraform/staging
        run: terraform plan -input=false -no-color -out=staging.plan || true
      - name: Show staging
        working-directory: infra/terraform/staging
        run: terraform show -no-color staging.plan > ../../staging.plan.txt || true
      - name: Init prod
        working-directory: infra/terraform/prod
        run: terraform init -input=false
      - name: Plan prod
        working-directory: infra/terraform/prod
        run: terraform plan -input=false -no-color -out=prod.plan || true
      - name: Show prod
        working-directory: infra/terraform/prod
        run: terraform show -no-color prod.plan > ../../prod.plan.txt || true
      - name: Diff plans
        run: |
          diff -u infra/terraform/staging.plan.txt infra/terraform/prod.plan.txt > tf-parity.diff || true
          echo "Generated tf parity diff"
      - name: Upload parity diff
        uses: actions/upload-artifact@v4
        with:
          name: tf-parity-diff
          path: tf-parity.diff
      - name: Fail if significant differences
        run: |
          set -e
          if [ -s tf-parity.diff ]; then
            echo "Terraform parity differences detected" >&2
            exit 1
          fi


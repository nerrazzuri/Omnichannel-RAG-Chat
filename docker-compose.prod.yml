version: '3.8'

networks:
  frontend_net:
  backend_net:
  data_net:

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  database_url:
    file: ./secrets/database_url.txt
  redis_url:
    file: ./secrets/redis_url.txt

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      # Enable 443 if you provide certificates to /etc/nginx/certs
      # - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/conf.d:/etc/nginx/conf.d:ro
      - ./reverse-proxy/certs:/etc/nginx/certs:ro
    networks:
      - frontend_net
      - backend_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://gateway.local/api
    networks:
      - frontend_net
    depends_on:
      - gateway
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AI_CORE_URL=http://ai-core:8000
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - jwt_secret
    networks:
      - backend_net
      - frontend_net
    depends_on:
      - ai-core
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 256M

  ai-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV=prod
      - DATABASE_URL_FILE=/run/secrets/database_url
      - REDIS_URL_FILE=/run/secrets/redis_url
      - QDRANT_URL=http://qdrant:6333
      - RAG_EMBED_MODEL=text-embedding-3-large
      - RAG_CHAT_MODEL=gpt-4o-mini
      - SENTRY_DSN
      - AUTH_ALLOW_ALL=0
      - AUTH_BYPASS_TENANT=
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
    secrets:
      - jwt_secret
      - openai_api_key
      - database_url
      - redis_url
    networks:
      - backend_net
      - data_net
    depends_on:
      - postgresql
      - redis
      - qdrant
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 256M

  postgresql:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot_prod
      POSTGRES_USER: chatbot_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "$(cat /run/secrets/redis_password)"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - data_net

  qdrant:
    image: qdrant/qdrant:v1.5.0
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - data_net

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend_net
    depends_on:
      - ai-core
      - gateway
    ports:
      - "9090:9090"
    
  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      # Set REDIS_PASSWORD via environment or remove if not required
    networks:
      - data_net
    depends_on:
      - redis

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      # Provide DSN via environment or Docker secret mounted to file and sourced via entrypoint script
      - DATA_SOURCE_URI=postgresql://chatbot_user@postgresql:5432/chatbot_prod?sslmode=disable
      - DATA_SOURCE_USER=chatbot_user
      - DATA_SOURCE_PASS_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - data_net
    depends_on:
      - postgresql



services:
  vault-agent:
    image: hashicorp/vault:1.15.5
    environment:
      - VAULT_ADDR=${VAULT_ADDR}
      - VAULT_TOKEN=${VAULT_TOKEN}
    command: ["agent", "-config=/config/agent.hcl"]
    volumes:
      - ./devops/vault:/config:ro
      - jwt_secret:/out

  ai-core:
    environment:
      - JWT_SECRET_FILE=/out/jwt_secret
    volumes:
      - jwt_secret:/out:ro
    depends_on:
      vault-agent:
        condition: service_started

  gateway:
    environment:
      - JWT_SECRET_FILE=/out/jwt_secret
    volumes:
      - jwt_secret:/out:ro
    depends_on:
      vault-agent:
        condition: service_started

volumes:
  jwt_secret:


